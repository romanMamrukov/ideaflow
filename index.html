<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4754d6"><meta name="description" content="IdeaFlow — от идей к действиям"><link rel="manifest" href="./manifest.webmanifest"><title>IdeaFlow — идеи в действие</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#182038;background:#f5f6fb}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}header{background:#fff;border-bottom:1px solid #e4e7f0;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}h1{margin:0;font-size:24px}h2{font-size:19px}main{max-width:1050px;margin:auto;padding:20px}.brand{color:#4754d6}.muted{color:#647087}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px}.panel{background:white;border:1px solid #e4e7f0;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 3px 14px #19234a08}input,textarea,select{width:100%;border:1px solid #d8ddeb;border-radius:9px;padding:11px;background:white;color:#182038}textarea{min-height:86px;resize:vertical}label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}.btn{background:#4754d6;color:white;border:0;border-radius:10px;padding:11px 15px;font-weight:650}.secondary{background:#eef0fb;color:#303d83}.danger{background:#fff0f0;color:#ad3333}.small{padding:7px 10px;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.item{padding:16px;border:1px solid #e3e6f0;border-radius:13px;margin:12px 0;background:#fff}.item h3{margin:0 0 5px}.meta{font-size:12px;color:#68758c}.progress{height:8px;background:#e9ebf5;border-radius:8px;overflow:hidden;margin:12px 0}.bar{height:100%;background:#4754d6}.task{display:flex;gap:8px;align-items:center;margin:8px 0}.task input{width:auto}.task span{overflow-wrap:anywhere}.done{text-decoration:line-through;color:#8c95a7}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f4f5fd;padding:13px;border-radius:12px;text-align:center}.stat strong{display:block;font-size:24px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input{flex:1;min-width:160px}.toolbar select{width:auto}.empty{padding:25px;text-align:center;color:#647087}.hide{display:none!important}footer{text-align:center;color:#6a7590;padding:20px;font-size:12px}@media(max-width:700px){.layout{grid-template-columns:1fr}main{padding:12px}.panel{padding:15px}header{padding:13px}h1{font-size:21px}.stats{gap:5px}.stat{padding:8px}.stat strong{font-size:19px}}
</style></head><body>
<header><h1><span class="brand">Idea</span>Flow</h1><span class="muted">MVP 0.1 · Offline-first</span></header>
<main><section class="stats panel"><div class="stat"><strong id="total">0</strong>Идей</div><div class="stat"><strong id="active">0</strong>В работе</div><div class="stat"><strong id="finished">0</strong>Завершено</div></section>
<div class="layout"><aside><section class="panel"><h2 id="formTitle">Новая идея</h2><form id="form"><input type="hidden" id="editing"><label for="title">Название *</label><input id="title" maxlength="140" required placeholder="Чего хочу достичь?"><label for="description">Описание</label><textarea id="description" placeholder="Зачем это важно?"></textarea><label for="category">Категория</label><select id="category"><option>Личное</option><option>Бизнес</option><option>Обучение</option><option>Здоровье</option><option>Творчество</option><option>Другое</option></select><label for="priority">Приоритет</label><select id="priority"><option>Средний</option><option>Высокий</option><option>Низкий</option></select><label for="status">Статус</label><select id="status"><option>Идея</option><option>В работе</option><option>Завершено</option></select><div class="actions" style="margin-top:14px"><button class="btn" type="submit">Сохранить</button><button type="button" id="cancel" class="btn secondary hide">Отмена</button></div></form></section><section class="panel"><h2>Данные</h2><p class="muted">Хранятся только в этом браузере. Для переноса между устройствами используйте резервную копию.</p><div class="actions"><button class="btn secondary small" id="export">Экспорт JSON</button><button class="btn secondary small" id="importBtn">Импорт JSON</button><input type="file" accept=".json,application/json" id="importFile" class="hide"></div></section></aside>
<section><div class="panel"><h2>Мои идеи</h2><div class="toolbar"><input id="search" placeholder="Поиск..."><select id="filter"><option value="">Все статусы</option><option>Идея</option><option>В работе</option><option>Завершено</option></select></div><div id="items"></div></div></section></div></main><footer>IdeaFlow · Бесплатный локальный прототип · Без аккаунта и облачной синхронизации</footer>
<script>
(()=>{'use strict';const KEY='ideaflow-v01';const $=id=>document.getElementById(id);let data=[];try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))data=saved}catch(e){alert('Не удалось прочитать сохранённые данные. Экспортируйте резервную копию, если она есть.')}const uid=()=>globalThis.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Не удалось сохранить данные: хранилище заполнено или заблокировано.')}};const el=(tag,cls,txt)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x};function render(){const q=$('search').value.toLocaleLowerCase(),f=$('filter').value;$('total').textContent=data.length;$('active').textContent=data.filter(x=>x.status==='В работе').length;$('finished').textContent=data.filter(x=>x.status==='Завершено').length;const root=$('items');root.replaceChildren();const visible=data.filter(x=>(!f||x.status===f)&&((x.title+' '+x.description+' '+x.category).toLocaleLowerCase().includes(q)));if(!visible.length){root.append(el('p','empty','Пока ничего нет. Запишите первую идею.'));return}visible.sort((a,b)=>b.updated-a.updated).forEach(x=>{const card=el('article','item');card.append(el('h3','',x.title),el('div','meta',x.category+' · '+x.priority+' · '+x.status));if(x.description)card.append(el('p','',x.description));const tasks=Array.isArray(x.tasks)?x.tasks:[];const completed=tasks.filter(t=>t.done).length;const pct=tasks.length?Math.round(completed/tasks.length*100):x.status==='Завершено'?100:0;card.append(el('p','meta','Задачи: '+completed+'/'+tasks.length+' · '+pct+'%'));const track=el('div','progress'),bar=el('div','bar');bar.style.width=pct+'%';track.append(bar);card.append(track);tasks.forEach(t=>{const row=el('label','task'),check=el('input');check.type='checkbox';check.checked=!!t.done;check.addEventListener('change',()=>{t.done=check.checked;x.updated=Date.now();save();render()});row.append(check,el('span',t.done?'done':'',t.text));card.append(row)});const add=el('form','actions');add.style.marginTop='12px';const input=el('input');input.placeholder='Следующий шаг...';input.maxLength=200;input.required=true;input.style.flex='1';input.style.minWidth='130px';const addBtn=el('button','btn small','Добавить шаг');addBtn.type='submit';add.append(input,addBtn);add.addEventListener('submit',e=>{e.preventDefault();const v=input.value.trim();if(!v)return;x.tasks.push({id:uid(),text:v,done:false});x.updated=Date.now();save();render()});card.append(add);const buttons=el('div','actions');buttons.style.marginTop='12px';const edit=el('button','btn secondary small','Изменить');edit.onclick=()=>{['title','description','category','priority','status'].forEach(k=>$(k).value=x[k]);$('editing').value=x.id;$('formTitle').textContent='Редактирование';$('cancel').classList.remove('hide');window.scrollTo({top:0,behavior:'smooth'})};const remove=el('button','btn danger small','Удалить');remove.onclick=()=>{if(confirm('Удалить идею и все её задачи?')){data=data.filter(i=>i.id!==x.id);save();render()}};buttons.append(edit,remove);card.append(buttons);root.append(card)})}function reset(){ $('form').reset();$('editing').value='';$('formTitle').textContent='Новая идея';$('cancel').classList.add('hide')}$('form').addEventListener('submit',e=>{e.preventDefault();const title=$('title').value.trim();if(!title)return;const values={title,description:$('description').value.trim(),category:$('category').value,priority:$('priority').value,status:$('status').value,updated:Date.now()};const id=$('editing').value;if(id){const x=data.find(v=>v.id===id);if(x)Object.assign(x,values)}else data.push({id:uid(),...values,tasks:[]});save();reset();render()});$('cancel').onclick=reset;$('search').oninput=render;$('filter').onchange=render;$('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'IdeaFlow',version:1,exported:new Date().toISOString(),ideas:data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ideaflow-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5e6)throw Error('Файл слишком большой');const parsed=JSON.parse(await file.text());if(parsed.app!=='IdeaFlow'||!Array.isArray(parsed.ideas)||parsed.ideas.length>10000)throw Error('Неверный формат');const clean=parsed.ideas.map(x=>{if(!x||typeof x.title!=='string'||typeof x.id!=='string'||!Array.isArray(x.tasks))throw Error('Некорректные записи');return{id:x.id.slice(0,100),title:x.title.slice(0,140),description:String(x.description||'').slice(0,10000),category:String(x.category||'Другое').slice(0,100),priority:String(x.priority||'Средний').slice(0,100),status:String(x.status||'Идея').slice(0,100),updated:Number(x.updated)||Date.now(),tasks:x.tasks.slice(0,2000).filter(t=>t&&typeof t.text==='string').map(t=>({id:String(t.id||uid()),text:t.text.slice(0,200),done:!!t.done}))}});if(confirm('Заменить все текущие идеи данными из резервной копии?')){data=clean;save();render()}}catch(err){alert('Ошибка импорта: '+err.message)}e.target.value=''};render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))})();
</script></body></html>
